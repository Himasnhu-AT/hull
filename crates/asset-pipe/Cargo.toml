[package]
name = "asset-pipe"
description = "3D asset pipeline: glTF in, staged cook (validate, normalize, textures, LODs, collider, impostor), cooked asset + .asset.ron sidecar out. No Bevy. The `desc` types are shared with the engine's runtime loader."
edition = "2024"
version = "0.1.0"
license = "MIT OR Apache-2.0"
publish = false

[features]
# The offline tool (readers, writers, stages, CLI). The engine's runtime depends on this crate with
# `default-features = false`: it then only gets the sidecar types.
default = ["pipeline"]
pipeline = ["dep:image", "dep:serde_json"]

[dependencies]
glam = { version = "0.33", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
ron = { version = "0.12", default-features = false }
serde_json = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"], optional = true }

[[bin]]
name = "asset-pipe"
path = "src/bin/asset-pipe.rs"
required-features = ["pipeline"]
