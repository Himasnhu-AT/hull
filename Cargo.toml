# Hull's Rust: the kernels (plan-rust.md). One crate, built to one WebAssembly module by `pnpm kernels:build`.
# Nothing else in the repo is Rust; a person making a game never runs cargo.
[workspace]
members = ["crates/hull-kernels"]
resolver = "2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
