[package]
name = "engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT OR Apache-2.0"
description = "Reusable game shell on Bevy: app bootstrap, settings, menus, pause, UI kit, rendering presets, audio, input, devtools."

[workspace]
members = [".", "crates/pcg-core", "crates/editor-proto", "crates/editor-ui"]

[dependencies]
bevy = { version = "=0.20.1", features = ["jpeg"] }
avian3d = { version = "=0.8.0", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "6"
rand = "0.9"
# vfx: instance buffer casting (already in the tree through bevy).
bytemuck = { version = "1", features = ["derive"], optional = true }
# devtools: test control port (TCP + MCP), offscreen rendering, perf stats.
ashlar-control = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530", optional = true }
ashlar-command = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530", optional = true }
ashlar-mcp = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530", optional = true }
sysinfo = { version = "0.38", default-features = false, features = ["system"], optional = true }
# devtools perf monitor: process/thread CPU, memory footprint, GPU probes (macOS/Linux FFI).
libc = "0.2"
# trace: crash / hang / frame-time reporting (no-op unless an endpoint is configured).
ashlar-trace = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530", features = ["sysinfo"], optional = true }
# devkit golden images: PNG decode/encode. Same version + features Bevy already builds (no new copy).
image = { version = "0.25", default-features = false, features = ["png"], optional = true }
# world: RON world descriptions and 16-bit PNG heightmaps (both already in Bevy's tree; no new features).
ron = { version = "0.12", default-features = false, optional = true }
pcg-core = { path = "crates/pcg-core", optional = true }
logic-core = { path = "crates/logic-core", optional = true }
# ruspy (the user's language), branch `embed` pinned by rev; bump when ruspy changes.
ruspy = { git = "https://github.com/Himasnhu-AT/ruspy", rev = "982b759423b5984e0112c891a1c6f3868f8d3de1", default-features = false, optional = true }
png = { version = "0.18", default-features = false, optional = true }
# net: compact serde wire format for replicated components / messages (pulls only cobs + serde).
postcard = { version = "1", default-features = false, features = ["alloc"], optional = true }
# voice: microphone capture (the same cpal Bevy audio already builds).
cpal = { version = "0.17.3", optional = true }
# editor: egui inside the Bevy window (bevy_egui) hosting the Bevy-free editor UI (src/editor, docs/EDITOR.md).
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts", "manage_clipboard"], optional = true }
editor-proto = { path = "crates/editor-proto", optional = true }
editor-ui = { path = "crates/editor-ui", optional = true, features = ["snarl"] }

[features]
# Dev defaults. Games depend with `default-features = false` and turn `devtools`/`trace` on
# through their own `dev` feature, so ship builds carry none of it (docs/PORTING.md, "Ship builds").
default = [
    "physics",
    "devtools",
    "trace",
    "devkit",
    "look",
    "anim",
    "world",
    "pcg",
    "vfx",
    "ai",
    "vehicle",
    "sound",
    "actions",
    "l10n",
    "props",
    "level",
    "spline",
    "logic",
    "scripting",
    "photo",
    "weather",
    "daytime",
    "camera_rigs",
    "spray",
    "foliage",
]
# AI-friendly dev loop: ECS inspector commands, scenario test kit, perf assertions, scope
# profiling, JSON hot reload, save slots, asset checks (docs/DEVKIT.md).
devkit = ["dep:image"]
# Tracy profiling through Bevy (`bevy/trace_tracy`). Optional: recompiles Bevy, never in default.
profile = ["bevy/trace_tracy"]
# Asset hot reload through Bevy's file watcher (`bevy/file_watcher`). Optional: recompiles Bevy.
hot_reload = ["bevy/file_watcher"]
# System / entity debug names in `ecs.systems` etc. (`bevy/debug`). Optional: recompiles Bevy.
debug_names = ["bevy/debug"]
# KTX2 + zstd loading for cooked textures (scripts/cook.py). Optional: recompiles Bevy.
ktx2 = ["bevy/ktx2", "bevy/zstd_rust"]
# avian3d: physics time is paused with the game; re-exported as `engine::avian3d`.
physics = ["dep:avian3d"]
# First-person controller (kinematic collide-and-slide + mouse look). Needs physics.
fps = ["physics"]
# Wheeled vehicles: raycast suspension, tyres, drivetrain, winch (src/vehicle, docs/VEHICLE.md). Needs physics.
vehicle = ["physics"]
# Control port + MCP, offscreen capture, perf overlay. Ship builds turn this off.
devtools = ["dep:ashlar-control", "dep:ashlar-command", "dep:ashlar-mcp", "dep:sysinfo"]
trace = ["dep:ashlar-trace"]
# Code-first scene look (sun/sky/fog/exposure/grading/lens), probes, decals: src/look, docs/LOOK.md.
look = []
# PCSS soft shadows for the look sun (forwards to a non-default Bevy feature: recompiles Bevy).
look_pcss = ["look", "bevy/experimental_pbr_pcss"]
# Clustered (projector) decals for the look. Recompiles Bevy.
look_clustered_decals = ["look", "bevy/pbr_clustered_decals"]
# Code-first character animation: state machines, blend spaces, layers/masks, root motion,
# notifies, IK, springs, LOD (src/anim, docs/ANIM.md). Foot placement needs `physics` too.
anim = []
# Particles / visual effects (src/vfx, docs/VFX.md).
vfx = ["dep:bytemuck"]
# Procedural content generation: pcg-core graphs evaluated per cell, spawned as scenery (docs/PCG.md).
pcg = ["dep:pcg-core"]
# Navigation (tiled navmesh baking, paths, crowds), behaviour trees, utility AI, perception.
ai = ["physics"]
# Audio middleware: buses, snapshots, ducking, cues, voice limits, 3D, occlusion, music, captions (src/sound/).
sound = []
# Large worlds: terrain, scatter, cell streaming, HLOD, floating origin, worlds as data (docs/WORLD.md).
world = ["dep:ron", "dep:png"]
# Action mapping (keyboard/mouse/gamepad, contexts, rebinding), accessibility, colour filter.
actions = []
# Localization: assets/locale/<lang>.ftl string tables, tr()/tr_args(), pseudo-locale.
l10n = []
# Breakable / bendable props: toppling posts, debris, plants that sway (src/props, docs/PROPS.md).
props = []
# Level files: LevelEntity + `levels/*.level.ron` through Bevy's reflected world format, hot reload, `--level` (src/level, docs/LEVELS.md).
level = ["dep:ron"]
# Splines: points with width/bank/tags, Catmull-Rom, nearest queries, road ribbon, gizmos (src/spline, docs/SPLINES.md).
spline = []
# Game logic as node graphs (assets/logic/*.logic.ron) and ruspy scripts (assets/scripts/*.ruspy): src/logic, docs/LOGIC.md.
logic = ["dep:logic-core", "dep:ruspy"]
# Godot-style node scripts in ruspy (Script component, lifecycle, signals, node paths, UI): src/scripting, docs/SCRIPTING.md.
scripting = ["logic"]
# Physical camera: lens / aperture / shutter / ISO, autofocus, photos with subject metadata (src/photo, docs/PHOTO.md).
photo = ["look", "physics", "dep:png"]
# Weather state machine (data + seeded schedule) driving look, rain/snow, wetness, wind (src/weather, docs/WEATHER.md).
weather = ["look", "vfx"]
# Day clock, solar sun + moon, stars, cloud dome + cloud shadows, night lights; drives the Look (src/daytime, docs/ENVIRONMENT.md).
daytime = ["look"]
# Camera rigs: spring-arm chase, mounted, orbit, free/photo + speed feel (src/camera_rigs, docs/ENVIRONMENT.md).
camera_rigs = []
# Surface spray (dust, mud, snow, water, chips) from wheels or any emitter, on vfx (src/spray, docs/ENVIRONMENT.md).
spray = ["vfx"]
# Runtime impostor rendering and LOD switching for distant trees (src/foliage, docs/ENVIRONMENT.md).
foliage = []
# React-style UI library on bevy_ui: tokens, components, declarative assets/ui/*.ui.ron screens, spatial focus, transitions, data binding (src/ui2, docs/UI2.md).
ui2 = ["dep:ron", "actions"]
# Multiplayer: transports, channels, replication, prediction (not in default: many games are single-player).
net = ["dep:postcard"]
# Voice chat over a net session: cpal capture, ADPCM, jitter buffer, push-to-talk / open mic, proximity (src/voice, docs/VOICE.md).
voice = ["net", "sound", "actions", "dep:cpal"]
# The level editor: `--editor` opens the game's own binary as an Unreal-style editor (src/editor, docs/EDITOR.md).
# Off by default; default and ship builds do not pull bevy_egui or editor-ui.
editor = ["devtools", "devkit", "level", "world", "pcg", "spline", "logic", "scripting", "dep:bevy_egui", "dep:editor-proto", "dep:editor-ui"]

[dev-dependencies]
ashlar-control = { git = "https://github.com/Himasnhu-AT/ashlar", rev = "561745aaf96e07a0efe2ed61f37b0a365f46a530" }

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

